services:
  postgres:
    image: postgres:16
    container_name: kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge_base
    ports:
      - "5432:5432"
    volumes:
      - kb_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: kb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knowledge
      MINIO_ROOT_PASSWORD: knowledge123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kb_minio_data:/data

volumes:
  kb_postgres_data:
  kb_minio_data:
