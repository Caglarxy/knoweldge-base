<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPTX Renderer Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #eef1f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #d8dee8;
    }

    .toolbar button,
    .toolbar select,
    .toolbar input::file-selector-button {
      height: 34px;
      border: 1px solid #c8d0dc;
      border-radius: 4px;
      padding: 0 10px;
      background: #fff;
      color: #1f2937;
      cursor: pointer;
    }

    .toolbar button:hover,
    .toolbar select:hover,
    .toolbar input::file-selector-button:hover {
      border-color: #2563eb;
    }

    .toolbar button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .toolbar input[type="file"] {
      width: 260px;
      height: 34px;
    }

    .status {
      margin-left: auto;
      font-size: 13px;
      color: #5b6472;
      white-space: nowrap;
    }

    #stage {
      height: calc(100vh - 55px);
      overflow: auto;
      padding: 24px;
      background: #e9edf3;
    }

    #pptx-container {
      min-height: 100%;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 70vh;
      color: #7b8491;
      border: 1px dashed #b8c1ce;
      background: #f8fafc;
    }

    .error {
      padding: 20px;
      color: #b42318;
      background: #fff1f0;
      border: 1px solid #f3b5ae;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <input id="file-input" type="file" accept=".pptx">
    <select id="mode-select" aria-label="渲染模式">
      <option value="slide">单页模式</option>
      <option value="list">列表模式</option>
    </select>
    <button id="prev-button" type="button" disabled>上一页</button>
    <button id="next-button" type="button" disabled>下一页</button>
    <button id="reset-zoom-button" type="button" disabled>重置缩放</button>
    <span id="status" class="status">未加载文件</span>
  </div>

  <main id="stage">
    <div id="pptx-container" class="empty">选择一个 PPTX 文件</div>
  </main>

  <script type="module">
    import {
      PptxViewer,
      RECOMMENDED_ZIP_LIMITS,
    } from "/vendor/pptx-renderer/aiden0z-pptx-renderer.browser.es.js";

    const fileInput = document.getElementById("file-input");
    const modeSelect = document.getElementById("mode-select");
    const prevButton = document.getElementById("prev-button");
    const nextButton = document.getElementById("next-button");
    const resetZoomButton = document.getElementById("reset-zoom-button");
    const status = document.getElementById("status");
    const stage = document.getElementById("stage");
    const container = document.getElementById("pptx-container");

    let viewer = null;
    let currentBuffer = null;
    let wheelLockedUntil = 0;

    function setStatus(text) {
      status.textContent = text;
    }

    function updateControls() {
      const isSlideMode = modeSelect.value === "slide";
      const hasViewer = Boolean(viewer);
      const index = hasViewer ? viewer.currentSlideIndex : 0;
      const count = hasViewer ? viewer.slideCount : 0;

      prevButton.disabled = !isSlideMode || !hasViewer || index <= 0;
      nextButton.disabled = !isSlideMode || !hasViewer || index >= count - 1;
      resetZoomButton.disabled = !hasViewer;
      setStatus(hasViewer ? `${index + 1} / ${count}` : "未加载文件");
    }

    async function openViewer() {
      if (!currentBuffer) return;

      viewer?.destroy();
      viewer = null;
      container.className = "";
      container.innerHTML = "";

      const mode = modeSelect.value;
      viewer = await PptxViewer.open(currentBuffer, container, {
        fitMode: "contain",
        renderMode: mode,
        lazySlides: true,
        lazyMedia: true,
        zipLimits: RECOMMENDED_ZIP_LIMITS,
        scrollContainer: stage,
        listOptions: {
          windowed: true,
          initialSlides: 4,
          batchSize: 4,
          showSlideLabels: true,
        },
        onSlideChange: updateControls,
        onSlideError: (index, error) => {
          console.error("slide render error", index, error);
        },
      });

      resetZoomButton.disabled = false;
      updateControls();
    }

    async function moveSlide(offset) {
      if (!viewer || modeSelect.value !== "slide") return;
      const target = viewer.currentSlideIndex + offset;
      if (target >= 0 && target < viewer.slideCount) {
        await viewer.goToSlide(target, { behavior: "smooth", block: "center" });
        updateControls();
      }
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;

      try {
        setStatus("解析中...");
        currentBuffer = await file.arrayBuffer();
        await openViewer();
        setStatus(`${file.name} · ${viewer.slideCount} 张`);
      } catch (error) {
        console.error(error);
        viewer?.destroy();
        viewer = null;
        container.className = "error";
        container.textContent = `PPTX 解析失败：${error.message || error}`;
        setStatus("解析失败");
        updateControls();
      }
    });

    modeSelect.addEventListener("change", openViewer);
    prevButton.addEventListener("click", () => moveSlide(-1));
    nextButton.addEventListener("click", () => moveSlide(1));
    resetZoomButton.addEventListener("click", async () => {
      if (viewer) {
        await viewer.setZoom(100);
        updateControls();
      }
    });

    stage.addEventListener("wheel", (event) => {
      if (!viewer || modeSelect.value !== "slide" || event.ctrlKey) return;
      if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;

      const now = Date.now();
      if (now < wheelLockedUntil) {
        event.preventDefault();
        return;
      }

      const direction = event.deltaY > 0 ? 1 : -1;
      const target = viewer.currentSlideIndex + direction;
      if (target < 0 || target >= viewer.slideCount) return;

      wheelLockedUntil = now + 350;
      event.preventDefault();
      moveSlide(direction);
    }, { passive: false });

    updateControls();
  </script>
</body>
</html>
